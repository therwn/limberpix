name: selftest

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dependencies: [minimum, current]
        include:
          - dependencies: minimum
            python: "3.11"
          - dependencies: current
            python: "3.12"
    defaults:
      run:
        shell: bash
    env:
      OUT: out                      # ignored by .gitignore
      PYTHONDONTWRITEBYTECODE: "1"
      PYW: -W error::DeprecationWarning
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install requirements
        run: |
          if [ "${{ matrix.dependencies }}" = "minimum" ]; then
            python -m pip install -r requirements.txt numpy==1.24.3 Pillow==13.0.0
          else
            python -m pip install --upgrade -r requirements.txt
          fi
          python -m pip check
          python -c "import numpy, PIL; print('numpy', numpy.__version__, 'Pillow', PIL.__version__)"

      - name: Check runtime dependency advisories
        run: |
          python -I - <<'PY'
          from importlib.metadata import version
          from json import load
          from urllib.request import urlopen

          found = []
          for package in ("numpy", "Pillow"):
              installed = version(package)
              with urlopen(f"https://pypi.org/pypi/{package}/{installed}/json", timeout=30) as response:
                  records = load(response)["vulnerabilities"]
              active = [item["id"] for item in records if not item.get("withdrawn")]
              print(f"{package} {installed}: {len(active)} active advisory record(s)")
              found.extend(active)
          if found:
              raise SystemExit(", ".join(found))
          PY

      - name: pixel-anim-check selftest
        run: python -I $PYW skills/pixel-anim-check/pixel_anim_selftest.py

      - name: prepare_sheet selftest
        run: python -I $PYW skills/pixel-anim-check/prepare_sheet.py --selftest

      - name: repair_sheet selftest
        run: python -I $PYW skills/pixel-anim-check/repair_sheet.py --selftest

      - name: body_parts selftest
        run: python -I $PYW skills/pixel-animate/body_parts_selftest.py

      - name: creature_map selftest
        run: python -I $PYW skills/pixel-animate/creature_map_selftest.py

      - name: shrink selftest
        run: python -I $PYW skills/pixel-animate/shrink_selftest.py

      - name: Selftests work from a clean skill installation
        run: python -I -B tests/standalone_selftest.py

      - name: Drawing tools publish complete result sets
        run: python -I -B tests/drawing_publication_test.py

      - name: Examples match the selftests' creatures
        run: python -I examples/make_examples.py --verify

      - name: All nine showcase loops pass without warnings
        run: |
          python -I -B - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path.cwd() / "examples" / "showcase"))
          import make_showcase as demo

          for key in demo.CREATURES:
              loops = demo.loops(key)
              assert set(loops) == {"idle", "move", "attack"}, key
              warnings = []
              faults = demo.pac.check(loops, demo.spec(key), warnings)
              print(key, len(loops), len(faults), len(warnings))
              if faults or warnings:
                  raise SystemExit(faults + warnings)
          PY

      - name: Clean examples pass (exit 0)
        run: |
          python -I skills/pixel-anim-check/pixel_anim_check.py \
            --loop idle=examples/walker_idle.png --loop move=examples/walker_move.png \
            --frame 34 --eye "#ffcc33" --out "$OUT" --name walker
          python -I skills/pixel-anim-check/pixel_anim_check.py \
            --loop idle=examples/flier_idle.png --loop move=examples/flier_move.png \
            --frame 30 --eye "#ffcc33" --flier --shadow "#2b2430" --out "$OUT" --name flier

      - name: The fighter example passes clean (exit 0, no warning)
        run: |
          python -I examples/fighter/fighter.py "$OUT/fighter"
          python -I skills/pixel-anim-check/pixel_anim_check.py \
            --loop idle="$OUT/fighter/fighter_idle.png" --frame 48 --eye "#3a1a14" --ink "#1b1420,#4a3346" \
            --parts idle="$OUT/fighter/fighter_idle_parts.png" \
            --palette "$OUT/fighter/fighter_art.png" --ref "$OUT/fighter/fighter_art.png" \
            --out "$OUT" --name fighter | tee "$OUT/fighter.txt"
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "fighter: 0 fault(s)" "$OUT/fighter.txt"
          ! grep -q "warn:" "$OUT/fighter.txt"

      - name: Broken example fails (exit 1)
        run: |
          set +e
          python -I skills/pixel-anim-check/pixel_anim_check.py \
            --loop idle=examples/walker_idle.png --loop move=examples/broken_move.png \
            --frame 34 --eye "#ffcc33" --out "$OUT" --name broken | tee "$OUT/broken.txt"
          code=${PIPESTATUS[0]}
          set -e
          echo "exit code: $code"
          test "$code" -eq 1
          grep -q "jump:" "$OUT/broken.txt"

      - name: body_parts runs on the example figure
        run: |
          python -I skills/pixel-animate/body_parts.py examples/figure.png examples/marks.json \
            --out "$OUT" --name figure
          python -I -B - "$OUT/figure_parts_manifest.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          manifest = Path(sys.argv[1])
          files = json.loads(manifest.read_text(encoding="utf-8"))
          assert set(files) == {"figure_parts.png", "figure_patches.png", "figure_labels.png", "figure_parts.json"}
          assert all((manifest.parent / name).is_file() for name in files.values())
          PY

      - name: Creature map rejects the two showcase attack strips
        run: |
          for creature in beast bird; do
            code=0
            output=$(python -I -B skills/pixel-animate/creature_map.py \
              "examples/showcase/$creature/${creature}_attack.png" --out "$OUT" 2>&1) || code=$?
            echo "$output"
            test "$code" -eq 2
            grep -q 'crop one frame' <<< "$output"
          done

      - name: Cut a flat drawing and check its idle
        run: python -I -B examples/cut_idle.py --out "$OUT/cut-idle"

      - name: Nothing tracked was changed
        run: git diff --exit-code
